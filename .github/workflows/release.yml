name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build plugin
        run: |
          chmod +x build.sh
          ./build.sh

      # Upload under a version-less name so the client portal can link to
      # releases/latest/download/novastats-hockeydata.zip (a direct file
      # download). Keep it the only asset: the update checker installs the
      # first release asset.
      - name: Identify the built zip file
        id: find_zip
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          mv "${ZIP_FILE}" novastats-hockeydata.zip
          echo "zip_file=novastats-hockeydata.zip" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.find_zip.outputs.zip_file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
